<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Reservations | City Central Library</title>
<meta name="description" content="My Reservations - Library Book Reservation System">
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="mine">
<header class="site-header" id="site-header"></header>
<main>

<section class="page-banner"><div class="container"><h1>My Reservations</h1><p>Track, manage and cancel your book reservations</p></div></section>
<section class="section" style="padding-top:36px"><div class="container">
  <div class="card student-info" id="student-info"></div>
  <div class="dash-grid">
    <div class="dash-card"><strong id="d-total">0</strong><span>Total Reservations</span></div>
    <div class="dash-card"><strong id="d-active">0</strong><span>Active</span></div>
    <div class="dash-card"><strong id="d-done">0</strong><span>Completed</span></div>
    <div class="dash-card"><strong id="d-cancel">0</strong><span>Cancelled</span></div>
  </div>
  <div class="tabs"><button class="tab active" data-filter="All">All</button><button class="tab" data-filter="Active">Active</button><button class="tab" data-filter="Completed">Completed</button><button class="tab" data-filter="Cancelled">Cancelled</button></div>
  <div class="res-list" id="res-list"></div>
</div></section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/script.js"></script>
<script src="js/reservation.js"></script>
</body>
</html>
